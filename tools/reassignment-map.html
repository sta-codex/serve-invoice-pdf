<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Arbol de reasignacion de bobinas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202428;
      --muted: #687178;
      --line: #c8cfd3;
      --page: #f3f5f5;
      --surface: #fff;
      --brand: #7a0019;
      --brand-soft: #f7e9ed;
      --green: #176c48;
      --green-soft: #e4f3ec;
      --blue: #1d5e87;
      --blue-soft: #e7f1f7;
      --amber: #805500;
      --amber-soft: #fff3d7;
      --danger: #9e2b2b;
      --danger-soft: #fdeaea;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }

    button { font: inherit; letter-spacing: 0; }
    .shell { width: min(1180px, calc(100% - 28px)); margin: 0 auto; padding: 20px 0 42px; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      border-bottom: 3px solid var(--brand);
      padding-bottom: 14px;
    }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 30px; line-height: 1.12; }
    .status {
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .status.applied { color: var(--green); background: var(--green-soft); }
    .status.reverted { color: var(--blue); background: var(--blue-soft); }
    .status.blocked { color: var(--danger); background: var(--danger-soft); }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      margin: 12px 0 18px;
      color: var(--muted);
      font-size: 12px;
    }
    .summary strong { color: var(--ink); font-size: 15px; }
    .summary button {
      margin-left: auto;
      min-height: 32px;
      border: 1px solid #aeb7bc;
      border-radius: 5px;
      background: var(--surface);
      padding: 6px 10px;
      cursor: pointer;
    }
    .notice { margin: 10px 0; border-left: 4px solid var(--amber); background: var(--amber-soft); padding: 9px 12px; }
    .notice.error { border-left-color: var(--danger); background: var(--danger-soft); }
    .tree-title { margin: 24px 0 13px; font-size: 18px; }
    .tree {
      position: relative;
      display: grid;
      gap: 16px;
      padding-left: 24px;
    }
    .tree::before {
      content: "";
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 18px;
      border-left: 2px solid #aeb7bc;
    }
    .item {
      position: relative;
      border-top: 4px solid #737e84;
      border-radius: 6px;
      background: var(--surface);
      box-shadow: 0 1px 2px rgba(20, 28, 33, .12);
    }
    .item.target { border-top-color: var(--brand); }
    .item::before {
      content: "";
      position: absolute;
      left: -17px;
      top: 27px;
      width: 17px;
      border-top: 2px solid #aeb7bc;
    }
    .item-head {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      justify-content: space-between;
      padding: 13px 16px 11px;
      border-bottom: 1px solid #e0e4e6;
    }
    .item-name { margin: 0; font-size: 18px; line-height: 1.2; }
    .item-role {
      flex: 0 0 auto;
      border-radius: 4px;
      background: #edf0f1;
      color: #4f5b61;
      padding: 4px 7px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .target .item-role { background: var(--brand-soft); color: var(--brand); }
    .branch { position: relative; margin: 0 16px 0 30px; padding: 12px 0 12px 20px; border-left: 2px solid var(--line); }
    .branch::before { content: ""; position: absolute; left: 0; top: 27px; width: 14px; border-top: 2px solid var(--line); }
    .route {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
      min-height: 29px;
      color: var(--muted);
      font-size: 12px;
    }
    .route-node {
      border: 1px solid var(--line);
      border-radius: 4px;
      background: #f7f8f8;
      padding: 5px 8px;
      color: var(--ink);
      font-weight: 700;
    }
    .route-note { border-color: #d5aab4; background: var(--brand-soft); color: var(--brand); }
    .route-arrow { font-weight: 900; color: #899399; }
    .moves {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 0 16px 14px;
    }
    .move-group { min-width: 0; }
    .move-title {
      margin: 0 0 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; align-items: stretch; }
    .coil {
      display: grid;
      grid-template-columns: auto;
      gap: 1px;
      min-width: 182px;
      max-width: 260px;
      border: 1px solid var(--line);
      border-left: 4px solid #707b81;
      border-radius: 5px;
      background: #fafbfb;
      padding: 7px 9px;
    }
    .coil.in { border-left-color: var(--green); background: var(--green-soft); }
    .coil.out { border-left-color: var(--blue); background: var(--blue-soft); }
    .coil strong { overflow-wrap: anywhere; font-size: 13px; }
    .coil-meta, .coil-direction { color: var(--muted); font-size: 11px; line-height: 1.3; }
    .coil-direction { color: var(--ink); font-weight: 700; }
    .rest {
      margin: 0 16px 15px;
      border: 1px dashed #aeb7bc;
      border-radius: 5px;
      background: #f4f6f6;
      padding: 8px 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .empty { color: var(--muted); font-size: 12px; }
    .fatal { margin-top: 20px; border: 1px solid #e0a7a7; background: var(--danger-soft); padding: 15px; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 18px, 1180px); padding-top: 12px; }
      header { grid-template-columns: 1fr; align-items: start; }
      h1 { font-size: 23px; }
      .status { justify-self: start; }
      .summary { gap: 10px 16px; }
      .summary button { margin-left: 0; }
      .tree { padding-left: 15px; }
      .tree::before { left: 3px; }
      .item::before { left: -12px; width: 12px; }
      .item-head { padding: 12px; }
      .item-name { font-size: 16px; }
      .branch { margin: 0 12px 0 18px; padding-left: 13px; }
      .branch::before { width: 9px; }
      .moves { grid-template-columns: 1fr; padding: 0 12px 12px; }
      .coil { min-width: min(100%, 210px); flex: 1 1 180px; max-width: none; }
      .rest { margin: 0 12px 12px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Reasignacion de bobinas</div>
        <h1 id="title">Cargando movimientos...</h1>
      </div>
      <div id="status" class="status">Cargando</div>
    </header>
    <div id="summary" class="summary"></div>
    <div id="notices"></div>
    <h2 class="tree-title">Items de venta implicados</h2>
    <section id="tree" class="tree"></section>
    <div id="fatal"></div>
  </main>
  <script>
    (() => {
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const uniqueById = (values) => {
        const seen = new Set();
        return values.filter((value) => value?.id && !seen.has(value.id) && seen.add(value.id));
      };
      const stockMeta = (stock) => {
        const parts = [];
        if (Number.isFinite(stock?.gross)) parts.push(`${new Intl.NumberFormat("es-ES").format(stock.gross)} kg`);
        if (stock?.location) parts.push(stock.location);
        return parts.join(" | ");
      };
      const statusText = { applied: "Cambios aplicados", reverted: "Cambios revertidos", blocked: "Sin cambios" };

      function decodePayload() {
        const encoded = location.hash.slice(1);
        if (!encoded) throw new Error("El enlace no contiene datos de movimientos.");
        const base64 = encoded.replace(/-/g, "+").replace(/_/g, "/") + "=".repeat((4 - encoded.length % 4) % 4);
        const binary = atob(base64);
        const bytes = Uint8Array.from(binary, (character) => character.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function itemContexts(payload) {
        if (Array.isArray(payload.saleItems) && payload.saleItems.length) return payload.saleItems;
        const targets = [];
        const donors = [];
        for (const movement of payload.movements || []) {
          if (movement.target?.saleItem) targets.push({ ...movement.target.saleItem, role: "target", otherStockCount: null });
          for (const item of movement.before?.saleItems || []) donors.push({ ...item, role: "donor", otherStockCount: null });
          for (const compensation of movement.compensations || []) {
            if (compensation.saleItem) donors.push({ ...compensation.saleItem, role: "donor", otherStockCount: null });
          }
        }
        const targetItems = uniqueById(targets);
        const targetIds = new Set(targetItems.map((item) => item.id));
        return [...targetItems, ...uniqueById(donors).filter((item) => !targetIds.has(item.id))];
      }

      function transportRoutes(item, payload) {
        const transports = [];
        for (const movement of payload.movements || []) {
          if (movement.target?.saleItem?.id === item.id && movement.target.transport) {
            transports.push(movement.target.transport);
          }
          if (item.role !== "target") {
            if ((movement.before?.saleItems || []).some((saleItem) => saleItem.id === item.id)) {
              transports.push(...(movement.before?.transports || []));
            }
            for (const compensation of movement.compensations || []) {
              if (compensation.saleItem?.id === item.id) transports.push(...(compensation.transports || []));
            }
          }
        }
        return uniqueById(transports);
      }

      function movementsForItem(item, payload) {
        const incoming = [];
        const outgoing = [];
        for (const movement of payload.movements || []) {
          const target = movement.target?.saleItem;
          if (target?.id === item.id) {
            if (movement.actual) incoming.push({ stock: movement.actual, direction: `Desde ${originLabel(movement)}` });
            if (movement.displaced) outgoing.push({ stock: movement.displaced, direction: `Hacia ${compensationLabel(movement, movement.displaced)}` });
          }
          const isOriginal = (movement.before?.saleItems || []).some((saleItem) => saleItem.id === item.id);
          if (isOriginal && movement.actual) {
            outgoing.push({ stock: movement.actual, direction: `Hacia ${target?.label || "item de destino"}` });
          }
          for (const compensation of movement.compensations || []) {
            if (compensation.saleItem?.id === item.id && compensation.replacement) {
              incoming.push({ stock: compensation.replacement, direction: `Desde ${target?.label || "item de destino"}` });
            }
          }
        }
        return { incoming: dedupeMoves(incoming), outgoing: dedupeMoves(outgoing) };
      }

      function originLabel(movement) {
        return (movement.before?.saleItems || []).map((item) => item.label).join(", ") || "sin item anterior";
      }

      function compensationLabel(movement, stock) {
        const match = (movement.compensations || []).find((entry) => entry.replacement?.id === stock.id);
        return match?.saleItem?.label || originLabel(movement);
      }

      function dedupeMoves(values) {
        const seen = new Set();
        return values.filter((entry) => entry.stock?.id && !seen.has(entry.stock.id) && seen.add(entry.stock.id));
      }

      function coilHtml(entry, type) {
        const meta = stockMeta(entry.stock);
        return `<div class="coil ${type}">
          <strong>${escapeHtml(entry.stock.label || entry.stock.id)}</strong>
          ${meta ? `<span class="coil-meta">${escapeHtml(meta)}</span>` : ""}
          <span class="coil-direction">${type === "in" ? "-> " : "<- "}${escapeHtml(entry.direction)}</span>
        </div>`;
      }

      function moveGroup(title, values, type) {
        return `<section class="move-group">
          <h4 class="move-title">${escapeHtml(title)} (${values.length})</h4>
          <div class="chips">${values.length ? values.map((value) => coilHtml(value, type)).join("") : '<span class="empty">Ninguna</span>'}</div>
        </section>`;
      }

      function itemHtml(item, payload) {
        const routes = transportRoutes(item, payload);
        const moves = movementsForItem(item, payload);
        const routeHtml = routes.length
          ? routes.map((transport) => `<span class="route-node">${escapeHtml(transport.label)}</span>${item.role === "target" ? `<span class="route-arrow">-></span><span class="route-node route-note">Albaran ${escapeHtml(payload.deliveryNote)}</span>` : ""}`).join("")
          : '<span class="empty">Sin transporte relacionado en los datos del movimiento</span>';
        const rest = Number.isFinite(item.otherStockCount)
          ? `Resto de existencias (${item.otherStockCount})`
          : "Resto de existencias (dato no disponible en este enlace antiguo)";
        return `<article class="item ${item.role === "target" ? "target" : "donor"}">
          <div class="item-head">
            <h3 class="item-name">${escapeHtml(item.label)}</h3>
            <span class="item-role">${item.role === "target" ? "Contiene el albaran" : "Item compensado"}</span>
          </div>
          <div class="branch"><div class="route">${routeHtml}</div></div>
          <div class="moves">
            ${moveGroup("Entran", moves.incoming, "in")}
            ${moveGroup("Salen", moves.outgoing, "out")}
          </div>
          <div class="rest">${escapeHtml(rest)}</div>
        </article>`;
      }

      function renderNotices(payload) {
        const container = document.getElementById("notices");
        for (const message of payload.errors || []) {
          container.insertAdjacentHTML("beforeend", `<div class="notice error"><strong>Error:</strong> ${escapeHtml(message)}</div>`);
        }
        for (const message of payload.warnings || []) {
          container.insertAdjacentHTML("beforeend", `<div class="notice"><strong>Aviso:</strong> ${escapeHtml(message)}</div>`);
        }
      }

      function render(payload) {
        const status = payload.status || "blocked";
        document.getElementById("title").textContent = payload.deliveryNote || "Albaran";
        const statusElement = document.getElementById("status");
        statusElement.className = `status ${status}`;
        statusElement.textContent = statusText[status] || status;
        const items = itemContexts(payload);
        const stockIds = new Set((payload.movements || []).flatMap((movement) => [
          movement.actual?.id,
          movement.displaced?.id,
          ...(movement.compensations || []).map((entry) => entry.replacement?.id),
        ].filter(Boolean)));
        document.getElementById("summary").innerHTML = `
          <span><strong>${items.length}</strong> items de venta</span>
          <span><strong>${stockIds.size}</strong> bobinas implicadas</span>
          <span>Version ${escapeHtml(payload.scriptVersion || "anterior")}</span>
          <button type="button" onclick="window.print()">Imprimir</button>`;
        renderNotices(payload);
        document.getElementById("tree").innerHTML = items.length
          ? items.map((item) => itemHtml(item, payload)).join("")
          : '<div class="fatal">No hay items de venta que mostrar.</div>';
      }

      try {
        render(decodePayload());
      } catch (error) {
        document.getElementById("title").textContent = "No se pudo abrir el arbol";
        document.getElementById("status").textContent = "Error";
        document.getElementById("status").className = "status blocked";
        document.getElementById("fatal").innerHTML = `<div class="fatal">${escapeHtml(error.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
