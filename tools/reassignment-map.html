<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Diagrama de reasignacion de bobinas</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202428;
      --muted: #687178;
      --line: #c7ced2;
      --page: #f3f5f5;
      --surface: #fff;
      --brand: #7a0019;
      --brand-soft: #f7e9ed;
      --green: #176c48;
      --green-soft: #e4f3ec;
      --blue: #17658f;
      --blue-soft: #e7f2f8;
      --amber: #805500;
      --amber-soft: #fff3d7;
      --danger: #9e2b2b;
      --danger-soft: #fdeaea;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    button { font: inherit; letter-spacing: 0; }
    .shell { width: min(1440px, calc(100% - 28px)); margin: 0 auto; padding: 20px 0 42px; }
    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      border-bottom: 3px solid var(--brand);
      padding-bottom: 14px;
    }
    .eyebrow { color: var(--brand); font-size: 12px; font-weight: 800; text-transform: uppercase; }
    h1 { margin: 3px 0 0; font-size: 30px; line-height: 1.12; }
    .status {
      border: 1px solid currentColor;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 12px;
      font-weight: 800;
    }
    .status.applied { color: var(--green); background: var(--green-soft); }
    .status.reverted { color: var(--blue); background: var(--blue-soft); }
    .status.blocked { color: var(--danger); background: var(--danger-soft); }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
      margin: 12px 0 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .summary strong { color: var(--ink); font-size: 15px; }
    .summary button {
      margin-left: auto;
      min-height: 32px;
      border: 1px solid #aeb7bc;
      border-radius: 5px;
      background: var(--surface);
      padding: 6px 10px;
      cursor: pointer;
    }
    details.notice {
      margin: 9px 0;
      border-left: 4px solid var(--amber);
      background: var(--amber-soft);
      padding: 9px 12px;
    }
    details.notice.error { border-left-color: var(--danger); background: var(--danger-soft); }
    details.notice summary { cursor: pointer; font-weight: 800; }
    details.notice ul { margin: 8px 0 0; padding-left: 20px; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 18px 0 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .legend span { display: inline-flex; gap: 6px; align-items: center; }
    .line-key { display: inline-block; width: 28px; border-top: 3px solid var(--blue); }
    .line-key.delivery { border-top-color: var(--brand); border-top-style: dashed; }
    .diagram-scroll { overflow-x: auto; padding-bottom: 8px; }
    .diagram {
      position: relative;
      min-width: max(900px, 100%);
      border: 1px solid #bcc5c9;
      border-radius: 6px;
      background: #e9eded;
      overflow: hidden;
    }
    .connections {
      position: absolute;
      inset: 0;
      z-index: 4;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .connection-path {
      opacity: .25;
      transition: opacity 140ms ease, stroke-width 140ms ease;
    }
    .diagram.is-filtering .connection-path { opacity: .06; }
    .diagram.is-filtering .connection-path.highlighted {
      opacity: 1;
      stroke-width: 4;
    }
    .state {
      position: relative;
      z-index: 2;
      padding: 16px;
      background: rgba(255, 255, 255, .92);
    }
    .state-head {
      display: flex;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 12px;
    }
    .state-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
    }
    .state h2 { margin: 0; font-size: 18px; }
    .state-note { color: var(--muted); font-size: 12px; }
    .contracts { display: flex; align-items: stretch; gap: 12px; }
    .contract {
      flex: 1 1 260px;
      min-width: 220px;
      border: 1px solid #aeb8bd;
      border-radius: 5px;
      background: #f7f8f8;
      box-shadow: 0 1px 2px rgba(20, 28, 33, .08);
    }
    .contract-head {
      min-height: 37px;
      border-bottom: 1px solid var(--line);
      padding: 9px 11px;
      color: #4e5960;
      font-size: 12px;
      font-weight: 800;
      text-align: center;
      text-transform: uppercase;
    }
    .contract-items { display: flex; gap: 9px; align-items: stretch; padding: 9px; }
    .sale-item {
      flex: 1 1 210px;
      min-width: 190px;
      border: 1px solid #d0d6d9;
      border-top: 4px solid #778289;
      border-radius: 4px;
      background: var(--surface);
      padding: 9px;
      transition: outline-color 140ms ease, box-shadow 140ms ease;
    }
    .sale-item.target { border-top-color: var(--brand); }
    .sale-item:hover,
    .sale-item:focus-visible,
    .sale-item.related-item {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
      box-shadow: 0 2px 8px rgba(23, 101, 143, .2);
    }
    .item-name {
      min-height: 34px;
      margin: 0 0 8px;
      font-size: 14px;
      line-height: 1.2;
      text-align: center;
    }
    .coils { display: grid; grid-template-columns: repeat(auto-fit, minmax(142px, 1fr)); gap: 6px; }
    .coil {
      position: relative;
      z-index: 5;
      min-width: 0;
      border: 1px solid #b8c1c6;
      border-left: 4px solid #707b81;
      border-radius: 4px;
      background: #f8f9f9;
      padding: 6px 7px;
    }
    .coil.delivery-stock {
      border-color: #bd7b89;
      border-left-color: var(--brand);
      background: var(--brand-soft);
    }
    .coil.changed { box-shadow: inset 0 0 0 1px rgba(23, 101, 143, .18); }
    .coil strong { display: block; overflow-wrap: anywhere; font-size: 12px; line-height: 1.15; }
    .coil small { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.25; }
    .rest {
      margin-top: 7px;
      border: 1px dashed #aeb7bc;
      border-radius: 4px;
      background: #f0f2f2;
      padding: 6px 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    .empty { padding: 8px; color: var(--muted); font-size: 11px; text-align: center; }
    .delivery-zone {
      position: relative;
      z-index: 3;
      display: flex;
      justify-content: center;
      min-height: 100px;
      padding: 20px 16px 26px;
      background: rgba(255, 255, 255, .92);
    }
    .delivery-node {
      position: relative;
      z-index: 5;
      align-self: center;
      max-width: 620px;
      border: 2px solid var(--brand);
      border-radius: 5px;
      background: var(--brand-soft);
      padding: 9px 14px;
      color: var(--brand);
      font-weight: 800;
      text-align: center;
    }
    .delivery-node small { display: block; margin-top: 2px; color: #6d3a45; font-weight: 600; }
    .divider {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #aeb7bc;
      border-bottom: 1px solid #aeb7bc;
      background: #dfe4e5;
      padding: 8px 16px;
      color: #445057;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .divider::before, .divider::after { content: ""; flex: 1; border-top: 1px solid #aeb7bc; }
    .after { padding-bottom: 22px; }
    .fatal { margin-top: 20px; border: 1px solid #e0a7a7; background: var(--danger-soft); padding: 15px; }

    @media (max-width: 720px) {
      .shell { width: min(100% - 18px, 1440px); padding-top: 12px; }
      header { grid-template-columns: 1fr; align-items: start; }
      h1 { font-size: 23px; }
      .status { justify-self: start; }
      .summary { gap: 10px 16px; }
      .summary button { margin-left: 0; }
      .diagram { min-width: 900px; }
      .state { padding: 12px; }
    }

    @media print {
      body { background: #fff; }
      .shell { width: 100%; padding: 0; }
      .summary button, details.notice { display: none; }
      .diagram-scroll { overflow: visible; }
      .diagram { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div class="eyebrow">Reasignacion de bobinas</div>
        <h1 id="title">Cargando movimientos...</h1>
      </div>
      <div id="status" class="status">Cargando</div>
    </header>
    <div id="summary" class="summary"></div>
    <div id="notices"></div>
    <div class="legend">
      <span><i class="line-key"></i> La bobina cambia de item</span>
    </div>
    <div class="diagram-scroll">
      <section id="diagram" class="diagram"></section>
    </div>
    <div id="fatal"></div>
  </main>
  <script>
    (() => {
      const escapeHtml = (value) => String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
      const statusText = {
        applied: "Cambios aplicados",
        reverted: "Cambios revertidos",
        blocked: "Sin cambios",
      };

      function decodePayload() {
        const encoded = location.hash.slice(1);
        if (!encoded) throw new Error("El enlace no contiene datos de movimientos.");
        const base64 = encoded.replace(/-/g, "+").replace(/_/g, "/")
          + "=".repeat((4 - encoded.length % 4) % 4);
        const bytes = Uint8Array.from(atob(base64), (character) => character.charCodeAt(0));
        return JSON.parse(new TextDecoder().decode(bytes));
      }

      function itemContexts(payload) {
        if (Array.isArray(payload.saleItems) && payload.saleItems.length) return payload.saleItems;
        const values = [];
        for (const movement of payload.movements || []) {
          if (movement.target?.saleItem) values.push({ ...movement.target.saleItem, role: "target" });
          for (const item of movement.before?.saleItems || []) values.push({ ...item, role: "donor" });
          for (const compensation of movement.compensations || []) {
            if (compensation.saleItem) values.push({ ...compensation.saleItem, role: "donor" });
          }
        }
        const seen = new Set();
        return values.filter((item) => item?.id && !seen.has(item.id) && seen.add(item.id));
      }

      function stockIndex(payload) {
        const stocks = new Map();
        for (const movement of payload.movements || []) {
          for (const stock of [
            movement.actual,
            movement.displaced,
            ...(movement.compensations || []).map((entry) => entry.replacement),
          ]) {
            if (stock?.id) stocks.set(stock.id, stock);
          }
        }
        return stocks;
      }

      function addAssignment(assignments, itemId, stock) {
        if (!itemId || !stock?.id) return;
        if (!assignments.has(itemId)) assignments.set(itemId, new Map());
        assignments.get(itemId).set(stock.id, stock);
      }

      function buildAssignments(payload) {
        const before = new Map();
        const after = new Map();
        for (const movement of payload.movements || []) {
          for (const item of movement.before?.saleItems || []) {
            addAssignment(before, item.id, movement.actual);
          }
          addAssignment(before, movement.target?.saleItem?.id, movement.displaced);
          addAssignment(after, movement.target?.saleItem?.id, movement.actual);
          for (const compensation of movement.compensations || []) {
            addAssignment(after, compensation.saleItem?.id, compensation.replacement);
          }
        }
        return { before, after };
      }

      function assignmentOwners(assignments) {
        const owners = new Map();
        for (const [itemId, stocks] of assignments) {
          for (const stockId of stocks.keys()) owners.set(stockId, itemId);
        }
        return owners;
      }

      function contractGroups(items) {
        const groups = new Map();
        for (const item of items) {
          const contract = item.saleContract || {
            id: `missing-${item.id}`,
            label: "Contrato no disponible en este enlace",
          };
          if (!groups.has(contract.id)) groups.set(contract.id, { contract, items: [] });
          groups.get(contract.id).items.push(item);
        }
        return [...groups.values()];
      }

      function coilHtml(stock, state, deliveryIds, changedIds) {
        const meta = [];
        if (Number.isFinite(stock?.gross)) {
          meta.push(`${new Intl.NumberFormat("es-ES").format(stock.gross)} kg`);
        }
        if (stock?.location) meta.push(stock.location);
        const classes = [
          "coil",
          deliveryIds.has(stock.id) && state === "before" ? "delivery-stock" : "",
          changedIds.has(stock.id) ? "changed" : "",
        ].filter(Boolean).join(" ");
        return `<div class="${classes}" data-state="${state}" data-stock-id="${escapeHtml(stock.id)}">
          <strong>${escapeHtml(stock.label || stock.id)}</strong>
          ${meta.length ? `<small>${escapeHtml(meta.join(" | "))}</small>` : ""}
        </div>`;
      }

      function itemHtml(item, state, assignments, deliveryIds, changedIds) {
        const stocks = [...(assignments.get(item.id)?.values() || [])];
        const rest = Number.isFinite(item.otherStockCount)
          ? `Resto de existencias (${item.otherStockCount})`
          : "Resto no disponible";
        return `<article class="sale-item ${item.role === "target" ? "target" : ""}"
          data-item-id="${escapeHtml(item.id)}" tabindex="0">
          <h3 class="item-name">${escapeHtml(item.label)}</h3>
          <div class="coils">
            ${stocks.length
              ? stocks.map((stock) => coilHtml(stock, state, deliveryIds, changedIds)).join("")
              : '<div class="empty">Sin bobinas implicadas en este estado</div>'}
          </div>
          <div class="rest">${escapeHtml(rest)}</div>
        </article>`;
      }

      function stateHtml(title, note, state, items, assignments, deliveryIds, changedIds) {
        const groups = contractGroups(items);
        return `<section class="state ${state}">
          <div class="state-head">
            <span class="state-number">${state === "before" ? "1" : "2"}</span>
            <h2>${escapeHtml(title)}</h2>
            <span class="state-note">${escapeHtml(note)}</span>
          </div>
          <div class="contracts">
            ${groups.map(({ contract, items: contractItems }) => `
              <section class="contract">
                <div class="contract-head">${escapeHtml(contract.label)}</div>
                <div class="contract-items">
                  ${contractItems.map((item) =>
                    itemHtml(item, state, assignments, deliveryIds, changedIds)
                  ).join("")}
                </div>
              </section>`).join("")}
          </div>
        </section>`;
      }

      function afterTitle(status) {
        if (status === "blocked") return ["Resultado propuesto", "No se ha aplicado"];
        if (status === "reverted") return ["Movimiento calculado", "Fue revertido"];
        return ["Despues", "Asignacion aplicada"];
      }

      function deliveryTransportLabel(payload) {
        const labels = [];
        const seen = new Set();
        for (const movement of payload.movements || []) {
          const transport = movement.target?.transport;
          if (transport?.id && !seen.has(transport.id)) {
            seen.add(transport.id);
            labels.push(transport.label);
          }
        }
        return labels.join(" | ");
      }

      function renderNotices(payload) {
        const container = document.getElementById("notices");
        const groups = [
          ["error", "Errores", payload.errors || []],
          ["warning", "Avisos", payload.warnings || []],
        ];
        for (const [kind, title, messages] of groups) {
          if (!messages.length) continue;
          container.insertAdjacentHTML("beforeend", `
            <details class="notice ${kind === "error" ? "error" : ""}">
              <summary>${messages.length} ${escapeHtml(title.toLowerCase())}</summary>
              <ul>${messages.map((message) => `<li>${escapeHtml(message)}</li>`).join("")}</ul>
            </details>`);
        }
      }

      function drawPath(svg, start, end, className, marker, metadata = {}) {
        const delta = Math.max(55, Math.abs(end.y - start.y) * .38);
        const direction = end.y >= start.y ? 1 : -1;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute(
          "d",
          `M ${start.x} ${start.y} C ${start.x} ${start.y + delta * direction}, ${end.x} ${end.y - delta * direction}, ${end.x} ${end.y}`
        );
        path.setAttribute("fill", "none");
        path.setAttribute("class", className);
        path.setAttribute("marker-end", `url(#${marker})`);
        path.dataset.fromItem = metadata.fromItem || "";
        path.dataset.toItem = metadata.toItem || "";
        path.dataset.stockId = metadata.stockId || "";
        svg.append(path);
      }

      function point(element, diagramRect, edge) {
        const rect = element.getBoundingClientRect();
        return {
          x: rect.left - diagramRect.left + rect.width / 2,
          y: edge === "top" ? rect.top - diagramRect.top : rect.bottom - diagramRect.top,
        };
      }

      function drawConnections(payload, changedIds, beforeOwners, afterOwners) {
        const diagram = document.getElementById("diagram");
        const svg = diagram.querySelector(".connections");
        if (!svg) return;
        svg.querySelectorAll(".movement-path, .delivery-path")
          .forEach((path) => path.remove());
        const diagramRect = diagram.getBoundingClientRect();
        svg.setAttribute("viewBox", `0 0 ${diagramRect.width} ${diagramRect.height}`);

        const beforeNodes = new Map(
          [...diagram.querySelectorAll('[data-state="before"][data-stock-id]')]
            .map((node) => [node.dataset.stockId, node])
        );
        const afterNodes = new Map(
          [...diagram.querySelectorAll('[data-state="after"][data-stock-id]')]
            .map((node) => [node.dataset.stockId, node])
        );
        for (const stockId of changedIds) {
          const before = beforeNodes.get(stockId);
          const after = afterNodes.get(stockId);
          if (!before || !after) continue;
          drawPath(
            svg,
            point(before, diagramRect, "bottom"),
            point(after, diagramRect, "top"),
            "connection-path movement-path",
            "movement-arrow",
            {
              fromItem: beforeOwners.get(stockId),
              toItem: afterOwners.get(stockId),
              stockId,
            }
          );
        }

        const deliveryNode = diagram.querySelector(".delivery-node");
        if (!deliveryNode) return;
        const actualIds = new Set(
          (payload.movements || []).map((movement) => movement.actual?.id).filter(Boolean)
        );
        for (const stockId of actualIds) {
          const stockNode = beforeNodes.get(stockId);
          if (!stockNode) continue;
          drawPath(
            svg,
            point(deliveryNode, diagramRect, "bottom"),
            point(stockNode, diagramRect, "top"),
            "connection-path delivery-path",
            "delivery-arrow",
            {
              fromItem: beforeOwners.get(stockId),
              toItem: afterOwners.get(stockId),
              stockId,
            }
          );
        }
      }

      function highlightItem(diagram, itemId) {
        diagram.classList.add("is-filtering");
        for (const item of diagram.querySelectorAll("[data-item-id]")) {
          item.classList.toggle("related-item", item.dataset.itemId === itemId);
        }
        for (const path of diagram.querySelectorAll(".connection-path")) {
          path.classList.toggle(
            "highlighted",
            path.dataset.fromItem === itemId || path.dataset.toItem === itemId
          );
        }
      }

      function clearItemHighlight(diagram) {
        diagram.classList.remove("is-filtering");
        diagram.querySelectorAll(".related-item")
          .forEach((item) => item.classList.remove("related-item"));
        diagram.querySelectorAll(".connection-path.highlighted")
          .forEach((path) => path.classList.remove("highlighted"));
      }

      function bindItemHighlights(diagram) {
        for (const item of diagram.querySelectorAll("[data-item-id]")) {
          item.addEventListener("mouseenter", () =>
            highlightItem(diagram, item.dataset.itemId)
          );
          item.addEventListener("mouseleave", () => clearItemHighlight(diagram));
          item.addEventListener("focus", () =>
            highlightItem(diagram, item.dataset.itemId)
          );
          item.addEventListener("blur", () => clearItemHighlight(diagram));
        }
      }

      function render(payload) {
        const status = payload.status || "blocked";
        const items = itemContexts(payload);
        const assignments = buildAssignments(payload);
        const beforeOwners = assignmentOwners(assignments.before);
        const afterOwners = assignmentOwners(assignments.after);
        const stocks = stockIndex(payload);
        const changedIds = new Set(
          [...stocks.keys()].filter((id) =>
            beforeOwners.has(id) && afterOwners.has(id) && beforeOwners.get(id) !== afterOwners.get(id)
          )
        );
        const deliveryIds = new Set(
          (payload.movements || []).map((movement) => movement.actual?.id).filter(Boolean)
        );
        const [resultTitle, resultNote] = afterTitle(status);

        document.getElementById("title").textContent = payload.deliveryNote || "Albaran";
        const statusElement = document.getElementById("status");
        statusElement.className = `status ${status}`;
        statusElement.textContent = statusText[status] || status;
        document.getElementById("summary").innerHTML = `
          <span><strong>${items.length}</strong> items de venta</span>
          <span><strong>${stocks.size}</strong> bobinas implicadas</span>
          <span><strong>${changedIds.size}</strong> cambian de item</span>
          <span>Version ${escapeHtml(payload.scriptVersion || "anterior")}</span>
          <button type="button" onclick="window.print()">Imprimir</button>`;
        renderNotices(payload);

        const transport = deliveryTransportLabel(payload);
        document.getElementById("diagram").innerHTML = `
          <svg class="connections" aria-hidden="true">
            <defs>
              <marker id="movement-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="#17658f"></path>
              </marker>
              <marker id="delivery-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="#7a0019"></path>
              </marker>
            </defs>
            <style>
              .movement-path { stroke: #17658f; stroke-width: 2.5; }
              .delivery-path { stroke: #7a0019; stroke-width: 2; stroke-dasharray: 6 4; }
            </style>
          </svg>
          <div class="delivery-zone">
            <div class="delivery-node">
              Albaran ${escapeHtml(payload.deliveryNote || "")}
              ${transport ? `<small>${escapeHtml(transport)}</small>` : ""}
            </div>
          </div>
          ${stateHtml("Antes", "Asignacion previa", "before", items, assignments.before, deliveryIds, changedIds)}
          <div class="divider">Reasignacion</div>
          ${stateHtml(resultTitle, resultNote, "after", items, assignments.after, deliveryIds, changedIds)}`;

        bindItemHighlights(document.getElementById("diagram"));
        requestAnimationFrame(() =>
          drawConnections(payload, changedIds, beforeOwners, afterOwners)
        );
        let resizeTimer;
        window.addEventListener("resize", () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(
            () => drawConnections(payload, changedIds, beforeOwners, afterOwners),
            80
          );
        });
      }

      try {
        render(decodePayload());
      } catch (error) {
        document.getElementById("title").textContent = "No se pudo abrir el diagrama";
        document.getElementById("status").textContent = "Error";
        document.getElementById("status").className = "status blocked";
        document.getElementById("fatal").innerHTML = `<div class="fatal">${escapeHtml(error.message)}</div>`;
      }
    })();
  </script>
</body>
</html>
